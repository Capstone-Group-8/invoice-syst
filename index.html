function loadMain() {

function loadInventory() {
    var mainpage =    `

<h3>Inventory</h3><br />
<table id="InventoryTable" class='table table-striped'><thead class='thead-dark'><tr>
            <th>Product Type</th>
            <th>Product ID</th>
            <th>Supplier</th>
            <th>Supplier's ID</th>
            <th>Description</th>
            <th>Quantity On Hand</th>
            <th>Quantity Desired</th>
            <th>Quantity Needed</th>
            <th>Last Price</th>
        </tr>
    </thead>
    <tbody></tbody>

</div>

</body>
`
document.body.innerHTML = head + mainpage
    fetch(API_URL+'/inventory')
        .then(res => res.json())
        .then(data => {
            const rtable = document.querySelector("#InventoryTable tbody");
            rtable.innerHTML = "";

            data.forEach(Item => {
if (Item.QtyOnHand > 0 || Item.TotalQtyDesired > 0) {
                const row = `
                    <tr>
                        <td>${Item.ProductType}</td>
                        <td>${Item.ProductID}</td>
                        <td>${Item.Supplier}</td>
                        <td>${Item.SuppliersID}</td>
                        <td>${Item.Description}</td>
                        <td>${Item.QtyOnHand}</td>
                        <td>${Item.TotalQtyDesired}</td>
                        <td>${Item.TotalQtyDesired-Item.QtyOnHand}</td>
                        <td>${Item.LastPrice}</td>
                        
                    </tr>
                `;
                rtable.innerHTML += row;
}
            });
        });
}

function loadInvoices() {

            rtable.innerHTML = "";

            data.forEach(Item => {

                            <td>${Item.Supplier}</td>

                        </tr>
                        `;
                    rtable.innerHTML += row;
                }
            });
        });
}

function loadSuppliers() {  
    document.body.innerHTML = head + baseBigPageHTML;
